{% extends 'user_home.html' %}
{%  block content %}
<section class="section-hero overlay inner-page bg-image" style="background-image: url('/static/images/hero_1.jpg');">
    <div class="block no-padding  gray">
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="inner2">
           
              <div class="inner-title2">
                <h2 style="font-weight: bold; color: black; text-align: center;">Upload Resume</h2>
              </div>
    
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
<br><br>
  {% csrf_token %}
  <head>
    <style>
        .box{
            border:5px solid black;
            background-color:white;
        }
    </style>
</head>
<div class=" box jumbotron container">
    
    <form action="" method="POST" enctype="multipart/form-data" style="align-items:center;">
        {% csrf_token %}
        {% for i in user_profile %}
        <div>
            Name:
        <input type="text" value="{{i.name}}" placeholder="Name" class="form-control" readonly><br>
        </div>
        <div>
            Email:
        <input type="email"  value="{{i.email}}" placeholder="Email" name="email"  class="form-control" readonly><br>
        </div>
        Phone:
        <input type="number"  value="{{i.phn}}" placeholder="Phone no." name="phone"  class="form-control" readonly><br>
        Highest qualification:
        <input type="text"  value="{{i.qualification}}" placeholder="qualification" name="qualification"  class="form-control" readonly><br>
        Experience in years:
        <input type="number"   placeholder="Experience in years" name="experience"  class="form-control"><br>
        {% endfor %}
        <input type="file" id="resume" name="resume" accept=".pdf, .jpg, .jpeg, .png"><br>
        <h5 style="color:red;">Note: </h5>
        <h5>You can only upload your resume in PDF format.</h5>
        
        <input type="submit" class="btn btn-success btn-sm" value="Submit Resume">
    
    </form>
</div>
{% endblock %}
