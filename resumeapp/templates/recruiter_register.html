{% extends 'index.html' %}
{% block content %}
    <section class="section-hero overlay inner-page bg-image" style="background-image: url('/static/images/hero_1.jpg');" id="home-section">
        <div class="container">
          <div class="row">
            <div class="col-md-7">
              <h1 class="text-white font-weight-bold">Register</h1>
              <div class="custom-breadcrumbs">
                <a href="#">Home</a> <span class="mx-2 slash">/</span>
                <span class="text-white"><strong>Register</strong></span>
              </div>
            </div>
          </div>
        </div>
      </section>
  
      <section class="site-section" id="next-section">
        <div class="container">
          <div class="row">
            <div class="col-lg-6 mb-5 mb-lg-0">
              <form action="/recruiter_register/" class="" enctype="multipart/form-data" method="post" onsubmit="return validateForm()">
                {% csrf_token %}
  
                <div class="row form-group">
                  <div class="col-md-6 mb-3 mb-md-0">
                    <label class="text-black" for="fname">Name Of Company</label>
                    <input type="text" id="fname" class="form-control" name="name" required>
                  </div>
                  <div class="col-md-6">
                    <label class="text-black" for="lname">Email</label>
                    <input type="email" id="lname" class="form-control" name="email" required>
                  </div>
                </div>
  
               
  
                  <div class="row form-group">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="text-black" for="fname">Phone Number</label>
                        <input type="text" id="fname" class="form-control" name="phn" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" required>
                      </div>
                    <div class="col-md-6">
                        <label class="text-black" for="lname">Address</label>
                        <input type="text" id="lname" class="form-control" name="adrs">
                      </div>
                    
                  </div>
                
                  <div class="row form-group">
                    <div class="col-md-6 mb-3 mb-md-0">
                      <label class="text-black" for="fname">Username</label>
                      <input type="text" id="fname" class="form-control" name="uname" pattern="[a-zA-Z0-9]+" title="Please enter only letters and numbers" required>
                    </div>
                    <div class="col-md-6">
                        <label class="text-black" for="lname">Password</label>
                        <input type="password" id="lname" class="form-control" name="pswd" pattern=".{6,}" title="Password must be at least 6 characters" required>
                      </div>
                  </div>
                  <div class="row form-group">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="text-black" for="fname">Place</label>
                        <input type="text" id="fname" class="form-control" name="plc">
                      </div>
                    
                  </div>
                  <br>
                  <div class="row form-group">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="text-black" for="logo">Company Logo</label>
                        <input type="file" id="logo" class="form-control" name="logo" accept="image/*">
                    </div>
                </div>
  
                <div class="row form-group">
                  <div class="col-md-12">
                    <input type="submit" value="Register" class="btn btn-primary btn-md text-white">
                  </div>
                </div>
  
    
              </form>
              <script>
                function validateForm() {
                    // Validate phone number
                    var phn = document.getElementById("phn");
                    if (!/^\d{10}$/.test(phn.value)) {
                        alert("Please enter a valid 10-digit phone number");
                        return false;
                    }
            
                    // Additional validation for other fields can be added here
            
                    return true;
                }
            </script>
            </div>
        </div>
    </div>
  </section>
            {%  endblock %}
